aid: motion-elements
name: Motion Elements
description: 'MotionElements is a global creative-asset marketplace and AI production platform offering
  an unlimited-download subscription catalog of 26M+ royalty-free assets: stock video, music, sound effects,
  motion and editing templates (After Effects, Premiere Pro, Final Cut / Apple Motion, DaVinci Resolve,
  .mogrt), photos, vectors, GIFs and Lottie animations, plus Studio AI generative tools. Its Marketplace
  API v2 lets platforms search, retrieve, license and download from the catalog using HTTP Basic authentication
  (API secret key as username) over HTTPS.'
