# generated: '2026-07-20'
# method: searched
# source: https://api-docs.motionelements.com/ (MotionElements Marketplace API v2 Postman collection)
openapi: 3.0.3
info:
  title: MotionElements Marketplace API
  version: 2.0.0
  description: MotionElements Marketplace API v2 lets you search, retrieve, license and download from
    the MotionElements library of 26M+ royalty-free stock video, music, sound effects, motion/editing
    templates (After Effects, Premiere Pro, Final Cut/Motion, DaVinci Resolve, .mogrt), photos, vectors,
    GIFs and Lottie animations. Authentication is HTTP Basic using your API secret key as the username
    (no password). All requests are over HTTPS. Harvested from the provider's published Postman collection
    (Marketplace API v2).
  contact:
    name: MotionElements Support
    email: support@motionelements.com
    url: https://www.motionelements.com/developer
  termsOfService: https://www.motionelements.com/legal/license
externalDocs:
  description: MotionElements API v2 documentation
  url: https://api-docs.motionelements.com/
servers:
- url: https://api.motionelements.com
  description: Production
security:
- basicAuth: []
tags:
- name: Account
  description: Authenticated account details.
- name: Search
  description: Search the marketplace across media types.
- name: Elements
  description: Retrieve individual marketplace elements.
- name: Media types
  description: 'Reference metadata: media types, categories, software versions, and music facets.'
paths:
  /v2/account:
    get:
      operationId: getAccount
      summary: Get account details
      tags:
      - Account
      description: Retrieve the authenticated account's details (subscription, credits, currency).
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Authentication failed (missing or invalid API secret key).
        '404':
          description: Resource not found.
      parameters:
      - &id001
        name: language
        in: query
        description: 'ISO 639-1 language code (lowercase) for returned data: en, ja, ko, zh-hant.'
        schema:
          type: string
          enum:
          - en
          - ja
          - ko
          - zh-hant
      - &id002
        name: currency
        in: query
        description: 'ISO 4217 currency code (uppercase) for pricing: USD, EUR, JPY, KRW, TWD.'
        schema:
          type: string
          enum:
          - USD
          - EUR
          - JPY
          - KRW
          - TWD
    patch:
      operationId: updateAccount
      summary: Update account details
      tags:
      - Account
      description: Update mutable settings on the authenticated account.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Authentication failed (missing or invalid API secret key).
        '404':
          description: Resource not found.
  /v2/search/video:
    get:
      operationId: searchVideos
      summary: Search videos
      tags:
      - Search
      description: Search videos in the MotionElements marketplace. Returns a paginated list of elements.
