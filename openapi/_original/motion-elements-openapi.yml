  /v2/media-types/{mediaType}/categories:
    get:
      operationId: listMediaTypeCategories
      summary: List media type categories
      tags:
      - Media types
      description: List media type categories.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                total_count: 3
                data:
                - object: category
                  id: '396'
                  name: Vintage
                  type: style
                - object: category
                  id: '70'
                  name: Slow Motion
                  type: style
                - object: category
                  id: '69'
                  name: Timelapse
                  type: style
        '401':
          description: Authentication failed (missing or invalid API secret key).
        '404':
          description: Resource not found.
      parameters:
      - name: mediaType
        in: path
        required: true
        description: Media type code (e.g. video, music, sfx, photo).
        schema:
          type: string
      - name: type
        in: query
        description: Category type filter (e.g. style).
        schema:
          type: string
      - *id001
      - *id002
