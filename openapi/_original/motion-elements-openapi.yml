      description: List all supported media types and their sub-media-types.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
              example:
                data:
                - object: media_type
                  id: image
                  code: image
                  name: Image ・ GIF
                  name_plural: Images ・ GIFs
                  name_seo: Stock Image ・ Animated GIF
                  name_seo_plural: Stock Image ・ Animated GIF
                  name_seo_free: Free stock image
                  name_short: Image
                  name_short_plural: Image
                  video: false
                  audio: false
                  group: image
                  sub_media_types:
                  - photo
                  - vector
                  - gif
